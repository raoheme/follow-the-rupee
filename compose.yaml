services:
  db:
    image: docker.io/postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: civic_lens
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local}
    ports: ["5432:5432"]
    volumes: [mcl_pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U civic -d civic_lens"], interval: 5s, timeout: 3s, retries: 20}
volumes: {mcl_pg: {}}
