      properties:
        type:
          const: FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/MapFeature'
    IssueList:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CivicIssue'
        total:
          type: integer
          minimum: 0
    DlpExceptionItem:
      type: object
      additionalProperties: false
      required:
      - issueId
      - candidateWorkOrderId
      - dlpStatus
      - warrantyPathNote
      - potentialSpendLabel
      - syntheticFreshRepairEstimatePaise
      properties:
        issueId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        candidateWorkOrderId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        dlpStatus:
          $ref: '#/components/schemas/DlpStatus'
        warrantyPathNote:
          type: string
          minLength: 1
          maxLength: 400
        potentialSpendLabel:
          const: SYNTHETIC_POTENTIAL_NOT_REALIZED_SAVINGS
        syntheticFreshRepairEstimatePaise:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    DlpExceptionList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DlpExceptionItem'
    AuthorityDashboard:
      type: object
      additionalProperties: false
      required:
      - asOf
      - openIssueCount
      - awaitingVerificationIssueIds
      - uncertainJurisdictionIssueIds
      - dlpExceptionIssueIds
      - traceabilityGapBudgetIds
      properties:
        asOf:
          type: string
          format: date-time
        openIssueCount:
          type: integer
          minimum: 0
        awaitingVerificationIssueIds:
          type: array
          items:
            type: string
            pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        uncertainJurisdictionIssueIds:
          type: array
          items:
            type: string
            pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        dlpExceptionIssueIds:
          type: array
          items:
            type: string
            pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        traceabilityGapBudgetIds:
          type: array
          items:
            type: string
            pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
    DuplicateScoreBreakdown:
      type: object
      additionalProperties: false
      required:
      - sameAssetOrSegment
      - sameCategory
      - withinConfiguredRadius
      - withinConfiguredWindow
      - keywordOverlap
      properties:
        sameAssetOrSegment:
          type: integer
          minimum: 0
          maximum: 40
        sameCategory:
          type: integer
          minimum: 0
          maximum: 20
        withinConfiguredRadius:
          type: integer
          minimum: 0
          maximum: 20
        withinConfiguredWindow:
          type: integer
          minimum: 0
          maximum: 10
        keywordOverlap:
          type: integer
          minimum: 0
          maximum: 10
    DuplicateCandidate:
      type: object
      additionalProperties: false
      required:
      - issueId
      - score
      - band
      - breakdown
      - possibleRecurrence
      properties:
        issueId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        score:
          type: integer
          minimum: 0
          maximum: 100
        band:
          enum:
          - LIKELY_SAME
          - POSSIBLE_MATCH
          - PROBABLY_DISTINCT
        breakdown:
          $ref: '#/components/schemas/DuplicateScoreBreakdown'
        possibleRecurrence:
          type: boolean
    DuplicateCandidates:
      type: object
      additionalProperties: false
      required:
      - policyLabel
      - choices
      - silentRejection
      - candidates
      properties:
        policyLabel:
          const: DEMONSTRATION_HEURISTIC_V1
        choices:
          type: array
          items:
            enum:
            - ENDORSE_EXISTING
            - ADD_EVIDENCE_TO_EXISTING
            - CREATE_SEPARATE_ISSUE
          minItems: 3
        silentRejection:
          const: false
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCandidate'
    AuditTimeline:
      type: object
      additionalProperties: false
      required:
      - entityId
      - events
      - hashChainNote
      properties:
        entityId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        events:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleEvent'
        hashChainNote:
          const: Append-oriented, hash-linked log for this demonstration; edits are detectable, not impossible.
    ResetReport:
      type: object
      additionalProperties: false
      required:
      - checkpoint
      - recordCounts
      - baselineDigest
      properties:
        checkpoint:
          const: CP-00
        recordCounts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        baselineDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
    HealthLive:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          const: UP
    HealthReady:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      - postgisVersion
      properties:
        status:
          enum:
          - READY
          - NOT_READY
        database:
          enum:
          - UP
          - DOWN
        postgisVersion:
          type:
          - string
          - 'null'
    VersionInfo:
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - packageVersion
      - recordNature
      properties:
        apiVersion:
          type: string
        packageVersion:
          const: 1.2.3
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
    CivicIssueResult:
      type: object
      additionalProperties: false
      required:
      - data
      - correlationId
      properties:
        data:
          $ref: '#/components/schemas/CivicIssue'
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
    IssueListResult:
      type: object
      additionalProperties: false
      required:
      - data
      - correlationId
      properties:
        data:
          $ref: '#/components/schemas/IssueList'
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
    KundaliResult:
      type: object
      additionalProperties: false
