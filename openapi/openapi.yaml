openapi: 3.1.0
info:
  title: Mumbai Civic Lens API
  version: 1.2.3
  description: Synthetic demonstration API. All operational records are SYNTHETIC_DEMONSTRATION data. This is not an official BMC service. Money
    is integer paise; timestamps are UTC ISO-8601 date-times; calendar dates are YYYY-MM-DD; GeoJSON is [longitude, latitude]. recordVersion is
    the single optimistic-concurrency authority (ETag is derived from it; stale writes return 409). The X-Demo-Persona header is a simulated demonstration
    persona, not authentication or authorization. Completion claimed is not completion verified, and silence never verifies closure.
servers:
- url: http://localhost:8080
security:
- DemoPersona: []
components:
  securitySchemes:
    DemoPersona:
      type: apiKey
      in: header
      name: X-Demo-Persona
      description: Simulated demonstration persona, not authentication or authorization.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
    Bbox:
      name: bbox
      in: query
      required: true
      description: minLon,minLat,maxLon,maxLat in WGS 84 (longitude first).
      schema:
        type: string
        pattern: ^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?$
    Ward:
      name: ward
      in: query
      schema:
        type: string
        pattern: ^[A-Z](/[A-Z])?$
    Category:
      name: category
      in: query
      schema:
        enum:
        - POTHOLE
        - DRAIN_BLOCKAGE
        - WATERLOGGING
        - FACILITY_REPAIR
    Status:
      name: status
      in: query
      schema:
        enum:
        - DRAFT_LOCAL
        - SUBMITTED_UNVERIFIED
        - TRIAGED_ASSIGNED
        - IN_PROGRESS
        - CLOSURE_CLAIMED_PENDING_VERIFICATION
        - VERIFIED_COMPLETE
        - DISPUTED_REOPENED
    DlpOnly:
      name: dlpOnly
      in: query
      schema:
        type: boolean
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Compatibility header. It must equal the quoted recordVersion of the target record, for example "3"; recordVersion in the command
        body is the single concurrency authority and a stale value returns 409 Conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    Position:
      type: array
      prefixItems:
      - type: number
        minimum: 72.77
        maximum: 72.99
      - type: number
        minimum: 18.89
        maximum: 19.275
      items: false
      minItems: 2
      maxItems: 2
    GeometryPoint:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          const: Point
        coordinates:
          $ref: '#/components/schemas/Position'
    GeometryLineString:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Position'
    GeometryPolygon:
      type: object
      additionalProperties: false
      required:
      - type
      - coordinates
      properties:
        type:
          const: Polygon
        coordinates:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              $ref: '#/components/schemas/Position'
    Geometry:
      oneOf:
      - $ref: '#/components/schemas/GeometryPoint'
      - $ref: '#/components/schemas/GeometryLineString'
      - $ref: '#/components/schemas/GeometryPolygon'
      description: GeoJSON geometry in [longitude, latitude] order, WGS 84 (SRID 4326), inside the Greater Mumbai bounds.
    Ward:
      type: object
      additionalProperties: false
      description: Synthetic ward context. The boundary is an illustrative box, not an official boundary.
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - code
      - displayName
      - localityLabel
      - role
      - electedOversightNote
      - boundary
      - boundaryNature
      - boundaryNote
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        code:
          type: string
          pattern: ^[A-Z](/[A-Z])?$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        localityLabel:
          type: string
          minLength: 1
          maxLength: 160
        role:
          enum:
          - PRIMARY_DEMONSTRATION
          - SCALE_PREVIEW
        electedOversightNote:
          type: string
          minLength: 1
          maxLength: 400
        boundary:
          $ref: '#/components/schemas/GeometryPolygon'
        boundaryNature:
          const: SYNTHETIC_ILLUSTRATIVE_BOX
        boundaryNote:
          type: string
          minLength: 1
          maxLength: 300
    Department:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - kind
      - displayName
      - wardId
      - postTitles
      - scopeSummary
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        kind:
          enum:
          - CENTRAL_DEPARTMENT
          - WARD_OFFICE
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        wardId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        postTitles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 160
          minItems: 1
        scopeSummary:
          type: string
          minLength: 1
          maxLength: 300
    CivicAsset:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - assetType
      - displayName
      - streetName
      - corridorName
      - nearbyLandmark
      - geometry
      - wardCandidateId
      - responsibleDepartmentId
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        assetType:
          enum:
          - ROAD_SEGMENT
          - DRAIN_SEGMENT
          - SCHOOL
          - DISPENSARY
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        streetName:
          type: string
          minLength: 1
          maxLength: 120
        corridorName:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 120
        nearbyLandmark:
          type: string
          minLength: 1
          maxLength: 160
        geometry:
          $ref: '#/components/schemas/Geometry'
        wardCandidateId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        responsibleDepartmentId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
    Jurisdiction:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - issueId
      - status
      - spatialMatchMethod
      - distanceToBoundaryMeters
      - candidateWardId
      - externalAgencyLabel
      - confirmationBasis
      - sourceConflictNote
      - legalOwnershipAsserted
      - confidenceNote
      - establishedAt
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        issueId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        status:
          enum:
          - UNKNOWN
          - SPATIALLY_INFERRED_PROVISIONAL
          - CONFIRMED_BMC_WARD
          - EXTERNAL_AGENCY_ASSIGNED
          - CONFLICT_DISPUTED
          - HANDOFF_LOGGED
        spatialMatchMethod:
          enum:
          - ST_COVERS
          - ST_INTERSECTS
          - NONE
        distanceToBoundaryMeters:
          type:
          - number
          - 'null'
          minimum: 0
        candidateWardId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        externalAgencyLabel:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 160
        confirmationBasis:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 300
        sourceConflictNote:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 400
        legalOwnershipAsserted:
          const: false
        confidenceNote:
          type: string
          minLength: 1
          maxLength: 300
        establishedAt:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            status:
              enum:
              - CONFIRMED_BMC_WARD
          required:
          - status
        then:
          properties:
            confirmationBasis:
              type: string
      - if:
          properties:
            status:
              enum:
              - SPATIALLY_INFERRED_PROVISIONAL
              - CONFLICT_DISPUTED
          required:
          - status
        then:
          properties:
            confirmationBasis:
              type: 'null'
    BudgetAllocation:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - displayTitle
      - budgetBookName
      - budgetHead
      - amountPaise
      - financialYear
      - departmentId
      - traceabilityStatus
      - lastProvenLink
      - missingNextLink
      - traceabilityExplanation
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        displayTitle:
          type: string
          minLength: 1
          maxLength: 200
        budgetBookName:
          type: string
          minLength: 1
          maxLength: 120
        budgetHead:
          type: string
          minLength: 1
          maxLength: 160
        amountPaise:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        financialYear:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        departmentId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        traceabilityStatus:
          enum:
          - LINKED_TO_STREET
          - GAP_BEFORE_STREET_GEOMETRY
        lastProvenLink:
          enum:
          - BUDGET
          - TENDER
          - CONTRACT
          - WORK_ORDER
          - ASSET_GEOMETRY
        missingNextLink:
          enum:
          - TENDER
          - CONTRACT
          - WORK_ORDER
          - STREET_LEVEL_GEOMETRY
          - null
        traceabilityExplanation:
          type: string
          minLength: 1
          maxLength: 400
      allOf:
      - if:
          properties:
            traceabilityStatus:
              const: GAP_BEFORE_STREET_GEOMETRY
          required:
          - traceabilityStatus
        then:
          properties:
            missingNextLink:
              type: string
            lastProvenLink:
              enum:
              - BUDGET
              - TENDER
              - CONTRACT
              - WORK_ORDER
        else:
          properties:
            missingNextLink:
              type: 'null'
            lastProvenLink:
              const: ASSET_GEOMETRY
    Tender:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - budgetId
      - tenderReference
      - title
      - status
      - publishedOn
      - estimatedValuePaise
      - scopeSummary
      - locationDescription
      - streetGeometryAvailable
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        budgetId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        tenderReference:
          type: string
          pattern: ^SYN-DEMO-TNR-[A-Z0-9-]+$
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          enum:
          - TENDER_PUBLISHED
          - CONTRACT_AWARDED
          - RETENDER_REQUIRED
        publishedOn:
          type: string
          format: date
        estimatedValuePaise:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        scopeSummary:
          type: string
          minLength: 1
          maxLength: 300
        locationDescription:
          type: string
          minLength: 1
          maxLength: 300
        streetGeometryAvailable:
          type: boolean
    ContractorRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - displayName
      - organizationKind
      - syntheticNote
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        organizationKind:
          const: SYNTHETIC_ORGANIZATION
        syntheticNote:
          type: string
          minLength: 1
          maxLength: 200
        officialPerformanceRating:
          type: 'null'
    Contract:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - tenderId
      - budgetId
      - vendorId
      - displayTitle
      - contractStatus
      - awardedOn
      - valuePaise
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        tenderId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        budgetId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        vendorId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        displayTitle:
          type: string
          minLength: 1
          maxLength: 200
        contractStatus:
          enum:
          - AWARDED
          - COMPLETED_IN_DLP
        awardedOn:
          type: string
          format: date
        valuePaise:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    WorkOrder:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - displayTitle
      - publicDescription
      - contractId
      - assetId
      - departmentId
      - valuePaise
      - startedOn
      - completionCertifiedOn
      - dlpEndsAt
      - status
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        displayTitle:
          type: string
          minLength: 1
          maxLength: 200
        publicDescription:
          type: string
          minLength: 1
          maxLength: 400
        contractId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        assetId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        departmentId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        valuePaise:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        startedOn:
          type: string
          format: date
        completionCertifiedOn:
          type:
          - string
          - 'null'
          format: date
        dlpEndsAt:
          type: string
          format: date-time
        status:
          enum:
          - BUDGETED_PROPOSED
          - TENDER_PUBLISHED
          - RETENDER_REQUIRED
          - CONTRACT_AWARDED
          - WORK_ORDER_ISSUED
          - IN_EXECUTION
          - SUSPENDED
          - COMPLETION_CERTIFIED_IN_DLP
          - DEFECT_NOTIFIED
          - DLP_EXPIRED_ARCHIVED
    DlpStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - workOrderId
      - dlpStartsOn
      - explanation
      - warrantyPathNote
      - syntheticFreshRepairEstimatePaise
      - potentialSpendLabel
      - dlpEndsAt
      - evaluatedAt
      - status
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        workOrderId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        dlpStartsOn:
          type: string
          format: date
        explanation:
          type: string
          minLength: 1
          maxLength: 400
        warrantyPathNote:
          type: string
          minLength: 1
          maxLength: 400
        syntheticFreshRepairEstimatePaise:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 9007199254740991
        potentialSpendLabel:
          enum:
          - SYNTHETIC_POTENTIAL_NOT_REALIZED_SAVINGS
          - null
        dlpEndsAt:
          type: string
          format: date-time
        evaluatedAt:
          type: string
          format: date-time
        status:
          enum:
          - NOT_STARTED
          - ACTIVE
          - EXPIRED
      allOf:
      - if:
          properties:
            syntheticFreshRepairEstimatePaise:
              type: integer
          required:
          - syntheticFreshRepairEstimatePaise
        then:
          properties:
            potentialSpendLabel:
              const: SYNTHETIC_POTENTIAL_NOT_REALIZED_SAVINGS
        else:
          properties:
            potentialSpendLabel:
              type: 'null'
      description: Derived view. status is computed from dlpStartsOn, the work order's dlpEndsAt and evaluatedAt (UTC midnight start, inclusive
        end); it is never stored.
    CivicIssue:
      type: object
      additionalProperties: false
      required:
      - id
      - recordNature
      - sourceTier
      - recordVersion
      - updatedAt
      - title
      - publicDescription
      - category
      - status
      - publicStatusExplanation
      - reportedAt
      - streetName
      - nearbyLandmark
      - geometry
      - assetId
      - workOrderId
      - wardCandidateId
      - responsibleDepartmentId
      - responsiblePostTitle
      - escalationPostTitle
      - journeys
      properties:
        id:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        recordNature:
          const: SYNTHETIC_DEMONSTRATION
        sourceTier:
          enum:
          - SYNTHETIC_DEMO
          - COMMUNITY_REFERENCE
          - OFFICIAL_SOURCE_PENDING
        recordVersion:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        title:
          type: string
          minLength: 1
          maxLength: 160
        publicDescription:
          type: string
          minLength: 1
          maxLength: 400
        category:
          enum:
          - POTHOLE
          - DRAIN_BLOCKAGE
          - WATERLOGGING
          - FACILITY_REPAIR
        status:
          enum:
          - DRAFT_LOCAL
          - SUBMITTED_UNVERIFIED
          - TRIAGED_ASSIGNED
          - IN_PROGRESS
          - CLOSURE_CLAIMED_PENDING_VERIFICATION
          - VERIFIED_COMPLETE
          - DISPUTED_REOPENED
        publicStatusExplanation:
          type: string
          minLength: 1
          maxLength: 300
        reportedAt:
          type: string
          format: date-time
        streetName:
          type: string
          minLength: 1
          maxLength: 120
        nearbyLandmark:
          type: string
          minLength: 1
          maxLength: 160
        geometry:
          $ref: '#/components/schemas/Geometry'
        assetId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        workOrderId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        wardCandidateId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        responsibleDepartmentId:
          type: string
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        responsiblePostTitle:
          type: string
          minLength: 1
          maxLength: 160
        escalationPostTitle:
          type: string
          minLength: 1
          maxLength: 160
        parentRecurrenceId:
          type:
          - string
          - 'null'
          pattern: ^SYN-DEMO-[A-Z0-9][A-Z0-9-]*$
        journeys:
          type: array
          items:
            enum:
