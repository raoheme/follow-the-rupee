    DuplicateCandidatesResult:
      type: object
      additionalProperties: false
      required:
      - data
      - correlationId
      properties:
        data:
          $ref: '#/components/schemas/DuplicateCandidates'
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
    EvidenceResult:
      type: object
      additionalProperties: false
      required:
      - data
      - correlationId
      properties:
        data:
          $ref: '#/components/schemas/Evidence'
        correlationId:
          type: string
