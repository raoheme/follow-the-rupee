  responses:
    CivicIssueOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CivicIssueResult'
      headers:
        ETag: &id001
          description: 'Entity tag derived strictly from recordVersion of the returned record: "{recordVersion}".'
          schema:
            type: string
            pattern: ^"[0-9]+"$
    IssueListOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueListResult'
    KundaliOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/KundaliResult'
      headers:
        ETag: *id001
    WorkOrderDetailOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkOrderDetailResult'
      headers:
        ETag: *id001
    BudgetTraceOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BudgetTraceResult'
    MapFeatureCollectionOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MapFeatureCollectionResult'
    AuthorityDashboardOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorityDashboardResult'
    DlpExceptionListOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DlpExceptionListResult'
    DuplicateCandidatesOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DuplicateCandidatesResult'
    EvidenceOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvidenceResult'
      headers:
        ETag: *id001
    JurisdictionOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JurisdictionResult'
      headers:
        ETag: *id001
    CompletionClaimOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompletionClaimResult'
      headers:
        ETag: *id001
    VerificationOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationResult'
      headers:
        ETag: *id001
    CorrectionOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CorrectionResult'
      headers:
        ETag: *id001
    AuditTimelineOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditTimelineResult'
    ResetReportOk:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetReportResult'
    HealthLiveOk:
      description: Liveness
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthLive'
    HealthReadyOk:
      description: Readiness
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthReady'
    VersionInfoOk:
      description: Version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionInfo'
    BadRequest:
      description: Malformed request (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or unrecognised simulated demonstration persona (RFC 9457); not an authentication result
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Simulated demonstration workflow eligibility: this persona is not eligible for the step in the demonstration workflow (RFC
        9457); never real authorization'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Record not found (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Stale write or state conflict: recordVersion (and any If-Match, which must equal its quoted form) does not match the current
        record (RFC 9457)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation or state-machine rule violated (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/HealthLiveOk'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe (database and PostGIS)
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/HealthReadyOk'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /version:
    get:
      operationId: getVersion
      summary: Package version
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/VersionInfoOk'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /v1/map/features:
    get:
      operationId: getMapFeatures
      summary: Map features in a bounding box
      parameters:
      - $ref: '#/components/parameters/Bbox'
      - $ref: '#/components/parameters/Ward'
      - $ref: '#/components/parameters/Category'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/DlpOnly'
      responses:
        '200':
          $ref: '#/components/responses/MapFeatureCollectionOk'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/issues:
    get:
      operationId: listIssues
      summary: List issues (1:1 parity with map filters)
      parameters:
      - $ref: '#/components/parameters/Ward'
      - $ref: '#/components/parameters/Category'
      - $ref: '#/components/parameters/Status'
      - $ref: '#/components/parameters/DlpOnly'
      responses:
        '200':
          $ref: '#/components/responses/IssueListOk'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: submitIssue
      summary: Submit a synthetic issue
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/CivicIssueOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitIssueCommand'
  /v1/issues/{id}:
    get:
      operationId: getIssue
      summary: Issue summary
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/CivicIssueOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/issues/{id}/duplicate-candidates:
    post:
      operationId: checkDuplicates
      summary: Deterministic duplicate check with three choices
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/DuplicateCandidatesOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDuplicatesCommand'
  /v1/issues/{id}/evidence:
    post:
      operationId: addEvidence
      summary: Attach synthetic evidence metadata
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/EvidenceOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEvidenceCommand'
  /v1/kundalis/{id}:
    get:
      operationId: getKundali
      summary: Civic Issue Kundali dossier
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
