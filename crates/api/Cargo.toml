[package]
name="mcl-api"
version="0.1.0"
edition="2021"
[lib]
name="mcl_api"
path="src/lib.rs"
[[bin]]
name="mcl-api"
path="src/main.rs"
[dependencies]
mcl-domain={path="../domain"}
mcl-application={path="../application"}
mcl-infrastructure={path="../infrastructure"}
axum={workspace=true}
tokio={workspace=true,features=["net","time","signal"]}
serde={workspace=true}
serde_json={workspace=true}
sqlx={workspace=true}
time={workspace=true,features=["parsing"]}
uuid={workspace=true}
tower-http={workspace=true}
tracing={workspace=true}
tracing-subscriber={workspace=true}
thiserror={workspace=true}
